name: Build prototypes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
      - run: npm run budget
      - run: node scripts/assemble-site.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7
